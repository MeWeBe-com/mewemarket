# MeweMarket hosted apps: nginx maps (http context). Copy to /etc/nginx/conf.d/mewemarket-maps.conf and reload nginx.

# Documenso's Content-Security-Policy carries a per-request nonce, so it can't be replaced wholesale: swap only
# its frame-ancestors directive, so mewemarket.com may show it in a frame.
map $upstream_http_content_security_policy $mewe_documenso_csp {
    "~^(?<csp_before>.*)frame-ancestors [^;]*(?<csp_after>.*)$" "${csp_before}frame-ancestors 'self' https://mewemarket.com${csp_after}";
    default $upstream_http_content_security_policy;
}

# Bookings (Easy!Appointments): the shared secret this proxy sends with every /{company}/book/ request, so the
# booking container trusts the company name it is given. Must equal EA_PROXY_KEY in .env.
map "" $mewe_ea_proxy_key {
    default "CHANGE_ME_EA_PROXY_KEY";
}

# Rate limits for the hosted apps, per visitor. Behind Cloudflare every request arrives from Cloudflare's
# addresses, so the visitor is taken from CF-Connecting-IP when present (only trust it if the origin accepts
# traffic from Cloudflare alone).
map $http_cf_connecting_ip $mewe_client {
    ""      $binary_remote_addr;
    default $http_cf_connecting_ip;
}
# Normal use of a busy app page is well under this; bursts (page loads with many assets) are absorbed.
limit_req_zone  $mewe_client zone=mewe_hosted:20m rate=30r/s;
# Sign-in, sign-up and password endpoints of the hosted products: people never use these directly
# (MeweMarket signs them in from the server), so keep them tight against guessing.
# Only POSTs count (pages fetch CSRF tokens from these paths with GET); an empty key isn't limited.
map $request_method $mewe_auth_client {
    POST    $mewe_client;
    default "";
}
limit_req_zone  $mewe_auth_client zone=mewe_auth:10m rate=10r/m;
# Public booking pages: anonymous visitors.
limit_req_zone  $mewe_client zone=mewe_public:10m rate=10r/s;
limit_conn_zone $mewe_client zone=mewe_conn:10m;
limit_req_status  429;
limit_conn_status 429;

# Sending: e-signature distribution and recipient changes, per visitor (each send can email many people).
limit_req_zone  $mewe_auth_client zone=mewe_send:10m rate=20r/m;
