# MeweMarket hosted apps: nginx maps (http context). Copy to /etc/nginx/conf.d/mewemarket-maps.conf and reload nginx.

# Documenso's Content-Security-Policy carries a per-request nonce, so it can't be replaced wholesale: swap only
# its frame-ancestors directive, so mewemarket.com may show it in a frame.
map $upstream_http_content_security_policy $mewe_documenso_csp {
    "~^(?<csp_before>.*)frame-ancestors [^;]*(?<csp_after>.*)$" "${csp_before}frame-ancestors 'self' https://mewemarket.com${csp_after}";
    default $upstream_http_content_security_policy;
}
