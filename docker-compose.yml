# Stateful services only. App processes run under PM2 on the host.
# Every service has hard caps (memory, CPU, processes) so one product, or one company abusing it, can't starve
# the rest of the server, and logs rotate so they can't fill the disk.
# All ports bind to 127.0.0.1; Caddy is the only public entrypoint.
x-logging: &logging
  driver: json-file
  options: { max-size: "10m", max-file: "3" }

services:
  postgres:
    mem_limit: 2g
    cpus: 2
    pids_limit: 1024
    logging: *logging
    image: pgvector/pgvector:pg16
    restart: unless-stopped
    environment:
      POSTGRES_USER: mewe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: mewemarket
    ports: ["127.0.0.1:5432:5432"]
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mewe -d mewemarket"]
      interval: 10s
      retries: 5

  redis:
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging: *logging
    image: redis:7-alpine
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    volumes: [redisdata:/data]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s

  minio:
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging: *logging
    image: minio/minio:RELEASE.2025-04-22T22-12-26Z
    restart: unless-stopped
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${S3_ACCESS_KEY}
      MINIO_ROOT_PASSWORD: ${S3_SECRET_KEY}
    ports: ["127.0.0.1:9000:9000", "127.0.0.1:9001:9001"]
    volumes: [miniodata:/data]
    healthcheck:
      test: ["CMD", "mc", "ready", "local"]
      interval: 15s

  umami:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    logging: *logging
    image: ghcr.io/umami-software/umami:postgresql-latest
    restart: unless-stopped
    environment:
      DATABASE_URL: postgres://mewe:${POSTGRES_PASSWORD}@postgres:5432/umami
      APP_SECRET: ${AUTH_SECRET}
    ports: ["127.0.0.1:3100:3000"]
    depends_on:
      postgres: { condition: service_healthy }

  # Twenty CRM (hosted "crm" app). One server, one Twenty workspace per MeweMarket workspace at
  # <company>.crm.mewemarket.com. Pinned to the version the integration was tested against; read the Twenty
  # upgrade notes before changing it. TWENTY_APP_SECRET must never change once set (it encrypts Twenty's keys).
  twenty:
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    logging: *logging
    image: twentycrm/twenty:v2.57.1
    restart: unless-stopped
    environment: &twenty-env
      NODE_PORT: "3000"
      SERVER_URL: ${TWENTY_URL}
      APP_SECRET: ${TWENTY_APP_SECRET}
      PG_DATABASE_URL: postgres://mewe:${POSTGRES_PASSWORD}@postgres:5432/twenty
      REDIS_URL: redis://redis:6379/1 # its own Redis database, apart from MeweMarket's queues
      IS_MULTIWORKSPACE_ENABLED: "true"
      DEFAULT_SUBDOMAIN: app
      IS_WORKSPACE_CREATION_LIMITED_TO_SERVER_ADMINS: "true"
      IS_EMAIL_VERIFICATION_REQUIRED: "false"
      STORAGE_TYPE: local
      TELEMETRY_ENABLED: "false"
      # Free Twenty allows 5 workspaces; set this once a 6th company needs the CRM.
      ENTERPRISE_KEY: ${TWENTY_ENTERPRISE_KEY:-}
    ports: ["127.0.0.1:3200:3000"]
    volumes: [twentydata:/app/packages/twenty-server/.local-storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }
    healthcheck:
      test: ["CMD-SHELL", "curl -fs http://localhost:3000/healthz || exit 1"]
      interval: 15s
      start_period: 180s

  twenty-worker:
    mem_limit: 1g
    cpus: 1
    pids_limit: 512
    logging: *logging
    image: twentycrm/twenty:v2.57.1
    restart: unless-stopped
    command: ["yarn", "worker:prod"]
    environment:
      <<: *twenty-env
      DISABLE_DB_MIGRATIONS: "true"
      DISABLE_CRON_JOBS_REGISTRATION: "true"
    volumes: [twentydata:/app/packages/twenty-server/.local-storage]
    depends_on:
      twenty: { condition: service_healthy }

  # --- InvoiceShelf (hosted "invoices" app): one server, one InvoiceShelf company per MeweMarket workspace,
  # at invoices.mewemarket.com. Pinned to the tested version.
  invoiceshelf:
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging: *logging
    image: invoiceshelf/invoiceshelf:2.4.7
    restart: unless-stopped
    environment:
      APP_URL: ${INVOICESHELF_URL}
      APP_KEY: ${INVOICESHELF_APP_KEY}
      DB_CONNECTION: pgsql
      DB_HOST: postgres
      DB_PORT: "5432"
      DB_DATABASE: invoiceshelf
      DB_USERNAME: mewe
      DB_PASSWORD: ${POSTGRES_PASSWORD}
      SESSION_DOMAIN: "null" # cookies stay on invoices.<domain>
      SANCTUM_STATEFUL_DOMAINS: ${INVOICESHELF_HOST}
      AUTORUN_ENABLED: "true" # runs its migrations on start
      NGINX_LISTEN_IP_PROTOCOL: ipv4
    ports: ["127.0.0.1:3210:8080"]
    volumes: [invoiceshelfdata:/var/www/html/storage]
    depends_on:
      postgres: { condition: service_healthy }

  # --- Chatwoot (hosted "helpdesk" app): community image (MIT, no enterprise code). One server, one Chatwoot
  # account per MeweMarket workspace, at chat.mewemarket.com. Needs pgvector (the postgres image has it).
  chatwoot: &chatwoot
    mem_limit: 1536m
    cpus: 1.5
    pids_limit: 512
    logging: *logging
    image: chatwoot/chatwoot:v4.19.1-ce
    restart: unless-stopped
    command: ["sh", "-c", "rm -f tmp/pids/server.pid; bundle exec rails s -b 0.0.0.0 -p 3000"]
    environment: &chatwoot-env
      FRONTEND_URL: ${CHATWOOT_URL}
      SECRET_KEY_BASE: ${CHATWOOT_SECRET_KEY_BASE}
      RAILS_ENV: production
      NODE_ENV: production
      INSTALLATION_ENV: docker
      RAILS_LOG_TO_STDOUT: "true"
      POSTGRES_HOST: postgres
      POSTGRES_PORT: "5432"
      POSTGRES_USERNAME: mewe
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DATABASE: chatwoot
      REDIS_URL: redis://redis:6379/2
      ENABLE_ACCOUNT_SIGNUP: "false"
      ACTIVE_STORAGE_SERVICE: local
      SMTP_ADDRESS: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USERNAME: ${SMTP_USER:-}
      SMTP_PASSWORD: ${SMTP_PASS:-}
      MAILER_SENDER_EMAIL: ${EMAIL_FROM:-}
    ports: ["127.0.0.1:3240:3000"]
    volumes: [chatwootdata:/app/storage]
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  chatwoot-worker:
    mem_limit: 1g
    cpus: 1
    pids_limit: 512
    logging: *logging
    <<: *chatwoot
    command: ["bundle", "exec", "sidekiq", "-C", "config/sidekiq.yml"]
    ports: []

  # --- Plane (hosted "projects" app): Community Edition (AGPL-3.0). One server, one Plane workspace per
  # MeweMarket workspace, at plane.mewemarket.com/{slug}/. The proxy (not Plane's own) routes the paths.
  plane-migrator: &plane
    mem_limit: 512m
    cpus: 1
    pids_limit: 256
    logging: *logging
    image: makeplane/plane-backend:v1.4.3
    restart: "no"
    command: ["./bin/docker-entrypoint-migrator.sh"]
    environment: &plane-env
      DATABASE_URL: postgresql://mewe:${POSTGRES_PASSWORD}@postgres:5432/plane
      REDIS_URL: redis://redis:6379/3
      AMQP_URL: redis://redis:6379/4 # Celery broker on Redis; no RabbitMQ needed
      SECRET_KEY: ${PLANE_SECRET_KEY}
      LIVE_SERVER_SECRET_KEY: ${PLANE_SECRET_KEY}
      WEB_URL: ${PLANE_URL}
      CORS_ALLOWED_ORIGINS: ${PLANE_URL}
      DEBUG: "0"
      USE_MINIO: "1"
      AWS_REGION: us-east-1
      AWS_ACCESS_KEY_ID: ${S3_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${S3_SECRET_KEY}
      AWS_S3_ENDPOINT_URL: http://minio:9000
      AWS_S3_BUCKET_NAME: plane-uploads
      FILE_SIZE_LIMIT: "5242880"
      GUNICORN_WORKERS: "2"
      # MeweMarket signs people in from one address, so the default 10/minute would throttle it.
      AUTHENTICATION_RATE_LIMIT: 600/minute
    depends_on:
      postgres: { condition: service_healthy }
      redis: { condition: service_healthy }

  plane-api:
    mem_limit: 768m
    cpus: 1
    pids_limit: 512
    logging: *logging
    <<: *plane
    restart: unless-stopped
    command: ["./bin/docker-entrypoint-api.sh"]
    ports: ["127.0.0.1:3230:8000"]
    depends_on:
      plane-migrator: { condition: service_completed_successfully }

  plane-worker:
    mem_limit: 768m
    cpus: 1
    pids_limit: 512
    logging: *logging
    <<: *plane
    restart: unless-stopped
    command: ["./bin/docker-entrypoint-worker.sh"]
    depends_on:
      plane-migrator: { condition: service_completed_successfully }

  plane-beat:
    mem_limit: 256m
    cpus: 0.25
    pids_limit: 128
    logging: *logging
    <<: *plane
    restart: unless-stopped
    command: ["./bin/docker-entrypoint-beat.sh"]
    depends_on:
      plane-migrator: { condition: service_completed_successfully }

  plane-web:
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    logging: *logging
    image: makeplane/plane-frontend:v1.4.3
    restart: unless-stopped
    ports: ["127.0.0.1:3231:3000"]

  plane-admin:
    mem_limit: 128m
    cpus: 0.25
    pids_limit: 128
    logging: *logging
    image: makeplane/plane-admin:v1.4.3
    restart: unless-stopped
    ports: ["127.0.0.1:3232:3000"]

  plane-space:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    logging: *logging
    image: makeplane/plane-space:v1.4.3
    restart: unless-stopped
    ports: ["127.0.0.1:3233:3000"]

  plane-live:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    logging: *logging
    image: makeplane/plane-live:v1.4.3
    restart: unless-stopped
    environment: *plane-env
    ports: ["127.0.0.1:3234:3000"]

  # --- Documenso (hosted "e-signatures" app): AGPL-3.0, billing off (no plan limits). One server, one
  # Documenso organisation per MeweMarket workspace, at sign.mewemarket.com. Needs SMTP (signing requests go
  # to outside signers) and a signing certificate (.p12) mounted at /opt/documenso/cert.p12.
  documenso:
    mem_limit: 768m
    cpus: 1
    pids_limit: 512
    logging: *logging
    image: ghcr.io/documenso/documenso:v2.21.1
    restart: unless-stopped
    environment:
      PORT: "3000"
      NEXTAUTH_SECRET: ${DOCUMENSO_NEXTAUTH_SECRET}
      NEXT_PRIVATE_ENCRYPTION_KEY: ${DOCUMENSO_ENCRYPTION_KEY}
      NEXT_PRIVATE_ENCRYPTION_SECONDARY_KEY: ${DOCUMENSO_ENCRYPTION_SECONDARY_KEY}
      NEXT_PUBLIC_WEBAPP_URL: ${DOCUMENSO_URL}
      NEXT_PRIVATE_INTERNAL_WEBAPP_URL: http://localhost:3000
      NEXT_PRIVATE_DATABASE_URL: postgres://mewe:${POSTGRES_PASSWORD}@postgres:5432/documenso
      NEXT_PRIVATE_DIRECT_DATABASE_URL: postgres://mewe:${POSTGRES_PASSWORD}@postgres:5432/documenso
      NEXT_PRIVATE_SIGNING_TRANSPORT: local
      NEXT_PRIVATE_SIGNING_LOCAL_FILE_PATH: /opt/documenso/cert.p12
      NEXT_PRIVATE_SIGNING_PASSPHRASE: ${DOCUMENSO_SIGNING_PASSPHRASE}
      NEXT_PUBLIC_UPLOAD_TRANSPORT: database
      NEXT_PRIVATE_SMTP_TRANSPORT: smtp-auth
      NEXT_PRIVATE_SMTP_HOST: ${SMTP_HOST:-}
      NEXT_PRIVATE_SMTP_PORT: ${SMTP_PORT:-587}
      NEXT_PRIVATE_SMTP_USERNAME: ${SMTP_USER:-}
      NEXT_PRIVATE_SMTP_PASSWORD: ${SMTP_PASS:-}
      NEXT_PRIVATE_SMTP_FROM_NAME: MeweMarket E-Signatures
      NEXT_PRIVATE_SMTP_FROM_ADDRESS: ${EMAIL_FROM:-}
      NEXT_PRIVATE_JOBS_PROVIDER: local
      DOCUMENSO_DISABLE_TELEMETRY: "true"
      # Only infra/hosted-setup.sh turns this off, briefly, to create the platform account.
      NEXT_PUBLIC_DISABLE_SIGNUP: ${DOCUMENSO_DISABLE_SIGNUP:-true}
    ports: ["127.0.0.1:3250:3000"]
    volumes: ["./infra/documenso/cert.p12:/opt/documenso/cert.p12:ro"]
    depends_on:
      postgres: { condition: service_healthy }

  # --- Easy!Appointments (hosted "bookings" app): GPL-3.0, single-company software made multi-company by our
  # router (infra/easyappointments/config.php): one container, one database per company, served on the main
  # site at mewemarket.com/{company}/book/ (the proxy strips the prefix and names the company).
  easyappointments-db:
    mem_limit: 512m
    cpus: 0.5
    pids_limit: 256
    logging: *logging
    image: mariadb:11
    restart: unless-stopped
    environment:
      MARIADB_ROOT_PASSWORD: ${EA_DB_ROOT_PASSWORD}
    volumes: [easyappointmentsdb:/var/lib/mysql]
    healthcheck:
      test: ["CMD", "healthcheck.sh", "--connect", "--innodb_initialized"]
      interval: 10s

  easyappointments:
    mem_limit: 384m
    cpus: 0.5
    pids_limit: 256
    logging: *logging
    image: alextselegidis/easyappointments:1.6.1
    restart: unless-stopped
    entrypoint: ["/start.sh"]
    environment:
      DB_HOST: easyappointments-db
      DB_USERNAME: root
      DB_PASSWORD: ${EA_DB_ROOT_PASSWORD}
      EA_PUBLIC_BASE: ${APP_URL}
      EA_PLATFORM_KEY: ${EA_PLATFORM_KEY}
      EA_PROXY_KEY: ${EA_PROXY_KEY}
    ports: ["127.0.0.1:3260:80"]
    volumes:
      - ./infra/easyappointments/config.php:/var/www/html/config.php:ro
      - ./infra/easyappointments/start.sh:/start.sh:ro
      - easyappointmentsdata:/var/www/html/storage
    depends_on:
      easyappointments-db: { condition: service_healthy }

volumes:
  easyappointmentsdb:
  easyappointmentsdata:
  invoiceshelfdata:
  chatwootdata:
  twentydata:
  pgdata:
  redisdata:
  miniodata:
